    <script>
      (function() {
        try {
          var m = localStorage.getItem('LearnPath_theme_mode') || localStorage.getItem('LearnPath_theme') || localStorage.getItem('theme') || 'auto';
          var isDark = m === 'dark' || (m === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.setAttribute('data-theme-mode', m);
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.setAttribute('data-theme-mode', m);
          }
        } catch (e) {}

        // Load reverse-engineered bundle dynamically so Vite does not attempt compile-time pre-transform
        var s = document.createElement('script');
        s.type = 'module';
        s.src = '/vendor/bundle.js';
        document.head.appendChild(s);
      })();
    </script>
